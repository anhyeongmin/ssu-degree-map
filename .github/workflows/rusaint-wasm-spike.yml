name: rusaint browser WASM spike

on:
  workflow_dispatch:
  push:
    branches:
      - rusaint-worker-port
    paths:
      - "rusaint-wasm-spike/**"
      - ".github/workflows/rusaint-wasm-spike.yml"
  pull_request:
    paths:
      - "rusaint-wasm-spike/**"
      - ".github/workflows/rusaint-wasm-spike.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusaint-wasm-spike
      - name: Prepare browser-only rusaint transport patch
        run: |
          git clone https://github.com/EATSTEAK/rusaint.git rusaint-browser-upstream
          git -C rusaint-browser-upstream checkout 103e04a8ccd37fa383ab339d6e39045983b5e2f2
          sed -i 's#ozra = { version = "0.0.4" }#ozra = { version = "0.0.4", default-features = false, features = ["gzip"] }#' rusaint-browser-upstream/packages/rusaint/Cargo.toml
          sed -i 's#rusaint = { version = "0.16.3", default-features = false, features = \["application"\] }#rusaint = { path = "../rusaint-browser-upstream/packages/rusaint", default-features = false, features = ["application"] }#' rusaint-wasm-spike/Cargo.toml
      - run: cargo tree --target wasm32-unknown-unknown -e features -i tokio --manifest-path rusaint-wasm-spike/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path rusaint-wasm-spike/Cargo.toml
      - run: ls -lh rusaint-wasm-spike/target/wasm32-unknown-unknown/release/*.wasm
