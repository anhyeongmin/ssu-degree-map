name: rusaint browser WASM

on:
  workflow_dispatch:
  push:
    branches:
      - rusaint-worker-port
    paths:
      - "rusaint-wasm-spike/**"
      - ".github/workflows/rusaint-wasm-spike.yml"
  pull_request:
    paths:
      - "rusaint-wasm-spike/**"
      - ".github/workflows/rusaint-wasm-spike.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusaint-wasm-spike
      - name: Compile browser adapter
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path rusaint-wasm-spike/Cargo.toml
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Generate browser module
        run: wasm-pack build rusaint-wasm-spike --target web --release --out-dir ../public/rusaint-web --out-name degree_map_rusaint_web
      - name: Verify generated module
        run: ls -lh public/rusaint-web/degree_map_rusaint_web.js public/rusaint-web/degree_map_rusaint_web_bg.wasm
